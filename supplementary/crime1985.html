<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国石油大学（华东）2025新生</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="utils/data.js"></script>
    <!-- <script src="https://unpkg.com/d3-regression@latest/dist/d3-regression.min.js"></script> -->
    <script src="utils/scatter.js"></script>
    <link rel="stylesheet" href="style/scatter.css">
</head>

<body>
    <div class="chart-container">
        <h2>1985年美国犯罪数据性别差异比例（从大到小排序）</h2>
        <div id="chart"></div>
    </div>

<!-- wb-demobar: 由 tools/build_supp.py 注入，给独立 demo 一个回站入口 -->
<style id="wb-demobar-style">
  .wb-demobar {
    position: fixed; right: 14px; bottom: 14px; z-index: 2147483000;
    display: flex; gap: 2px; align-items: center;
    font: 12px/1.4 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: rgba(20, 24, 33, .86); color: #e8edf5;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 999px; padding: 5px 6px 5px 12px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .28);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .wb-demobar span { opacity: .68; margin-right: 4px; }
  .wb-demobar a {
    color: #e8edf5; text-decoration: none; padding: 3px 9px; border-radius: 999px;
    transition: background .15s;
  }
  .wb-demobar a:hover, .wb-demobar a:focus-visible { background: rgba(255, 255, 255, .16); }
  @media print { .wb-demobar { display: none; } }
</style>
<div class="wb-demobar" role="navigation" aria-label="返回课程">
  <span>可视化导论</span>
  <a href="../">课程门户</a>
  <a href="../glossary.html">术语表</a>
</div>
</body>
<script>
    // 启动渲染
    main();
    // 测试树渲染
    async function main() {
        try {
            const data = await await d3.csv("data/1985CrimeGender.csv", function (d) {//本质上是在定义一个函数,d为参数
                return { crimeType:d.犯罪类型, male: +d.男性, female: +d.女性};
            });
            data.forEach(rec => {
                rec.genderDiffRatio = (rec.male-rec.female)/(rec.male+rec.female);
            });
            data.sort((a, b) => b.genderDiffRatio - a.genderDiffRatio);//排序
            renderScatter(data,"#chart");
        } catch (error) {
            console.error("渲染失败:", error);
            d3.select("#tree-container").html(`<div style="color:red">加载失败: ${error.message}</div>`);
        }
    }

</script>

</html>
